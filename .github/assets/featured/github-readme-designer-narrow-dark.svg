<svg xmlns="http://www.w3.org/2000/svg" width="640" height="760" viewBox="0 0 640 760" role="img" aria-labelledby="t d">
<title id="t">github-readme-designer</title>
<desc id="d">A plain grey README card is scanned by a registration line; behind it the designed version wipes in, with a hero band, a results chart that draws itself and a flow with a moving marker, then it rewinds.</desc>
<style>
.mono { font-family: ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; }
.serif { font-family: 'Iowan Old Style','Charter','Palatino Linotype',Georgia,serif; }
.sans { font-family: system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; }

.wipe { transform-box: fill-box; transform-origin: left center; }
.wipe { animation: wipe 12s linear infinite both; }
@keyframes wipe { 0%,8.0% { transform: scaleX(0); } 40.0%,90% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
.bar0 { stroke-dasharray: 256.5; }
.bar0 { animation: bar0 12s cubic-bezier(.2,.7,.2,1) infinite both; }
@keyframes bar0 { 0%,42.0% { stroke-dashoffset: 256.5; } 52.0%,90% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 256.5; } }
.bar1 { stroke-dasharray: 242.7; }
.bar1 { animation: bar1 12s cubic-bezier(.2,.7,.2,1) infinite both; }
@keyframes bar1 { 0%,45.0% { stroke-dashoffset: 242.7; } 55.0%,90% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 242.7; } }
.bar2 { stroke-dasharray: 242.7; }
.bar2 { animation: bar2 12s cubic-bezier(.2,.7,.2,1) infinite both; }
@keyframes bar2 { 0%,48.0% { stroke-dashoffset: 242.7; } 58.0%,90% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 242.7; } }
.ship { animation: ship 12s cubic-bezier(.6,0,.4,1) infinite both; }
@keyframes ship { 0%,55% { transform: translateX(0); opacity: 0; } 57% { opacity: 1; } 85%,100% { transform: translateX(500px); opacity: 1; } }
.scan { animation: scan 12s linear infinite both; }
@keyframes scan { 0%,7% { transform: translateX(0); opacity: 0; } 8% { transform: translateX(0); opacity: 1; }
  40% { transform: translateX(560px); opacity: 1; } 42%,89% { transform: translateX(560px); opacity: 0; }
  90% { transform: translateX(560px); opacity: 1; } 99.5% { transform: translateX(0); opacity: 1; } 100% { transform: translateX(0); opacity: 0; } }
.lb { animation: lb 12s linear infinite both; }
@keyframes lb { 0%,7% { opacity: 1; } 9%,92% { opacity: 0; } 95%,100% { opacity: 1; } }
.la { animation: la 12s linear infinite both; }
@keyframes la { 0%,38% { opacity: 0; } 41%,89% { opacity: 1; } 91%,100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<text class="mono" x="64" y="104" font-size="13" letter-spacing="2" fill="#55706A">A SKILL FOR CLAUDE CODE, CODEX AND CHATGPT</text>
<text class="serif" x="62" y="176" font-size="50" fill="#13302A">Your README,</text>
<text class="serif" x="62" y="234" font-size="50" font-style="italic" fill="#13302A">before and after.</text>
<text class="mono" x="64" y="286" font-size="15" fill="#55706A">Reads the repo, finds the proof, and builds</text>
<text class="mono" x="64" y="310" font-size="15" fill="#55706A">animated visuals that play right on GitHub.</text>

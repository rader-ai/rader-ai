<text class="mono" x="40" y="64" font-size="13" letter-spacing="2" fill="#8FA9A1">A SKILL FOR CLAUDE CODE, CODEX AND CHATGPT</text>
<text class="serif" x="38" y="130" font-size="44" fill="#E6F0EC">Your README,</text>
<text class="serif" x="38" y="182" font-size="44" font-style="italic" fill="#E6F0EC">before and after.</text>
<text class="mono" x="40" y="234" font-size="15" fill="#8FA9A1">Reads the repo, finds the proof, and builds</text>
<text class="mono" x="40" y="258" font-size="15" fill="#8FA9A1">animated visuals that play right on GitHub.</text>
